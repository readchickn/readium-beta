  <h1>Beta: Pets</h1>
  <p class="center"><a href="index.html">back to beta home</a> &middot; <a href="feedback.html">leave feedback</a></p>
  <p class="note center">This tests the real pet feature — it uses your real Readium account and XP. Feed and play cost 5 XP each.</p>

    <h2>sign in to test pets</h2>
    <p>You need a Readium account to test pets.</p>
    <label for="signin-email">email</label>

        <button id="pet-feed-btn">feed (5 xp)</button>

/* ---------- pets (same logic + data as the main Readium build) ---------- */
var PET_KEYS = ["cat", "dog", "frog", "penguin", "dragon"];
var PET_SWITCH_COST = 80;
var PET_FEED_COST = 5;
var PET_PLAY_COST = 5;
var petNames = { cat: "cat", dog: "dog", frog: "frog", penguin: "penguin", dragon: "dragon" };
var myPet = null;
var myXp = 0;
var myPetStats = null;
var myPetStatsAll = null;
var xpRef = null;
function myUid() { return auth.currentUser ? auth.currentUser.uid : null; }
function petCap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function flashNotice(m) { var el = document.getElementById("pet-msg"); if (el) { el.textContent = m; } }
function refreshHome() {}
function xpPad(n) { return (n < 10 ? "0" : "") + n; }
function xpDayKey(d) { return d.getFullYear() + "-" + xpPad(d.getMonth() + 1) + "-" + xpPad(d.getDate()); }
function xpMonthKey(d) { return d.getFullYear() + "-" + xpPad(d.getMonth() + 1); }
function xpWeekKey(d) {
  var t = new Date(d.getTime()); t.setHours(0, 0, 0, 0);
  t.setDate(t.getDate() + 3 - ((t.getDay() + 6) % 7));
  var y = t.getFullYear();
  var w1 = new Date(y, 0, 4);
  var wk = 1 + Math.round(((t - w1) / 86400000 - 3 + ((w1.getDay() + 6) % 7)) / 7);
  return y + "-W" + xpPad(wk);
}
function bumpXpDown(path, n) {
  db.ref(path).transaction(function (cur) {
    return Math.max(0, (typeof cur === "number" ? cur : 0) + n);
  });
}
function petLevelFor(xp) {
  // level 1 at 0 xp, level 2 at 50, level 3 at 150, level 4 at 300, level 5 at 500...
  // going from level n to n+1 needs 50*n more xp; total xp for level n is 25*n*(n-1)
  var x = (typeof xp === "number" && xp > 0) ? xp : 0;
  var lvl = 1;
  while (25 * (lvl + 1) * lvl <= x) { lvl++; }
  return lvl;
}
function petDrainPerHour(level) {
  return Math.max(0.5, 1 - 0.1 * (level - 1));
}
function petCurrentStats(stored) {
  // drain bars from updatedAt; never writes, only computes on read
  var st = stored || {};
  var xp = (typeof st.xp === "number") ? st.xp : 0;
  var lvl = petLevelFor(xp);
  var rate = petDrainPerHour(lvl);
  var hours = 0;
  if (typeof st.updatedAt === "number" && st.updatedAt > 0) {
    hours = Math.max(0, (Date.now() - st.updatedAt) / 3600000);
  }
  var drain = hours * rate;
  return {
    hunger: Math.max(0, Math.min(100, (typeof st.hunger === "number" ? st.hunger : 100) - drain)),
    happiness: Math.max(0, Math.min(100, (typeof st.happiness === "number" ? st.happiness : 100) - drain)),
    xp: xp, level: lvl
  };
}
function petStatsRef(pet) {
  var me = myUid();
  return me ? db.ref("users/" + me + "/petStats/" + pet) : null;
}
function petDeductXp(amount, cb) {
  // atomic: abort unless the user has enough xp (xp/<uid> is the live xp balance)
  var me = myUid();
  if (!me) { if (cb) { cb(false); } return; }
  db.ref("xp/" + me).transaction(function (cur) {
    var v = (cur && typeof cur.xp === "number") ? cur.xp : 0;
    if (v < amount) { return; } // abort - not enough xp
    return { xp: v - amount };
  }, function (err, committed) {
    if (err || !committed) { if (cb) { cb(false); } return; }
    var now2 = new Date();
    bumpXpDown("xpDaily/" + xpDayKey(now2) + "/" + me, -amount);
    bumpXpDown("xpWeekly/" + xpWeekKey(now2) + "/" + me, -amount);
    bumpXpDown("xpMonthly/" + xpMonthKey(now2) + "/" + me, -amount);
    if (cb) { cb(true); }
  });
}
function petApplyCare(which, cost) {
  // which: "feed" (+25 hunger) or "play" (+25 happiness); both +10 pet xp
  var me = myUid();
  if (!me || !myPet) { return; }
  var pet = myPet;
  if (myXp < cost) { flashNotice("not enough xp!"); return; }
  var before = myPetStats ? petLevelFor(myPetStats.xp) : 1;
  petDeductXp(cost, function (ok) {
    if (!ok) { flashNotice("not enough xp!"); return; }
    petStatsRef(pet).transaction(function (cur) {
      var now = Date.now();
      var st = petCurrentStats(cur || { hunger: 100, happiness: 100, xp: 0, updatedAt: now });
      if (which === "feed") { st.hunger = Math.min(100, st.hunger + 25); }
      else { st.happiness = Math.min(100, st.happiness + 25); }
      return { hunger: st.hunger, happiness: st.happiness, xp: st.xp + 10, updatedAt: now };
    }, function (err, committed, snap) {
      if (err || !committed) { flashNotice("something went wrong, try again."); return; }
      var v = snap.val() || {};
      myPetStats = petCurrentStats(v);
      var after = petLevelFor(myPetStats.xp);
      if (after > before) { flashNotice("your pet reached level " + after + "!"); }
      else { flashNotice(which === "feed" ? "yum! your pet feels full." : "your pet had fun!"); }
      renderPetScreen();
    });
  });
}
function petPick(key) {
  var me = myUid();
  if (!me || !PET_ART[key]) { return; }
  if (myPet === key) { return; }
  var owned = !!(myPetStatsAll && myPetStatsAll[key]);
  var firstPick = !myPet;
  var cost = (firstPick || owned) ? 0 : PET_SWITCH_COST;
  var adopt = function () {
    var now = Date.now();
    var up = {};
    up["users/" + me + "/pet"] = key;
    up["users/" + me + "/petStats/" + key] = { hunger: 100, happiness: 100, xp: 0, updatedAt: now };
    db.ref().update(up, function (err) {
      if (err) { flashNotice("something went wrong, try again."); return; }
      myPet = key;
      if (!myPetStatsAll) { myPetStatsAll = {}; }
      myPetStatsAll[key] = { hunger: 100, happiness: 100, xp: 0, updatedAt: now };
      myPetStats = { hunger: 100, happiness: 100, xp: 0, level: 1 };
      flashNotice(firstPick ? "you got a " + (petNames[key] || key) + "!" : "your pet is now a " + (petNames[key] || key) + "!");
      refreshHome();
      renderPetScreen();
    });
  };
  if (cost === 0) { adopt(); return; }
  if (myXp < cost) { flashNotice("not enough xp! a new pet costs 80 xp."); return; }
  petDeductXp(cost, function (ok) {
    if (!ok) { flashNotice("not enough xp! a new pet costs 80 xp."); return; }
    adopt();
  });
}
function renderPetPicker() {
  var box = document.getElementById("pet-picker");
  if (!box) { return; }
  box.innerHTML = "";
  var title = document.getElementById("pet-picker-title");
  if (title) {
    title.textContent = !myPet ? "pick your first pet — it's free!" : "switch pet — pets you own are free, a new pet costs 80 xp";
  }
  for (var i = 0; i < PET_KEYS.length; i++) {
    (function (key) {
      var owned = !!(myPetStatsAll && myPetStatsAll[key]);
      var d = document.createElement("div");
      d.className = "pet-pick" + (myPet === key ? " sel" : "");
      var im = document.createElement("img");
      im.src = PET_ART[key].idle; im.alt = petNames[key] || key; im.title = petNames[key] || key;
      d.appendChild(im);
      var lb = document.createElement("span");
      lb.textContent = (petNames[key] || key) + (myPet === key ? " (yours)" : (!myPet ? " (free)" : (owned ? " (owned)" : " (80 xp)")));
      d.appendChild(lb);
      d.onclick = function () { petPick(key); };
      box.appendChild(d);
    })(PET_KEYS[i]);
  }
}
function renderPetScreen() {
  var xpEl = document.getElementById("pet-xp");
  if (xpEl) { xpEl.textContent = myXp; }
  var main = document.getElementById("pet-main");
  if (!main) { return; }
  if (!myPet || !PET_ART[myPet]) {
    main.className = "hidden";
    renderPetPicker();
    return;
  }
  main.className = "";
  var st = myPetStats || { hunger: 100, happiness: 100, xp: 0, level: 1 };
  var img = document.getElementById("pet-img");
  img.src = (st.happiness >= 50) ? PET_ART[myPet].happy : PET_ART[myPet].idle;
  img.alt = petNames[myPet] || myPet;
  document.getElementById("pet-title").textContent = petCap(petNames[myPet] || myPet) + " — Lv " + st.level;
  var sad = document.getElementById("pet-sad-note");
  sad.textContent = (st.hunger < 25 || st.happiness < 25) ? "your pet is sad — feed it or play with it!" : "";
  document.getElementById("pet-hunger-num").textContent = Math.round(st.hunger) + " / 100";
  document.getElementById("pet-happy-num").textContent = Math.round(st.happiness) + " / 100";
  document.getElementById("pet-hunger-bar").style.width = Math.max(0, Math.min(100, st.hunger)) + "%";
  document.getElementById("pet-happy-bar").style.width = Math.max(0, Math.min(100, st.happiness)) + "%";
  var fb = document.getElementById("pet-feed-btn");
  var pb = document.getElementById("pet-play-btn");
  fb.disabled = st.hunger >= 100;
  pb.disabled = st.happiness >= 100;
  document.getElementById("pet-msg").textContent = "";
  renderPetPicker();
}
function loadPet() {
  // same as the main site's enterPetScreen, without showScreen (single page here)
  if (!myUid()) { return; }
  var me = myUid();
  db.ref("users/" + me + "/petStats").once("value", function (snap) {
    myPetStatsAll = snap.val() || {};
    if (!myPet) { myPetStats = null; renderPetScreen(); return; }
    var stored = myPetStatsAll[myPet];
    if (!stored) {
      // pet set but no stats yet (e.g. an old pet) - seed full bars
      var seed = { hunger: 100, happiness: 100, xp: 0, updatedAt: Date.now() };
      petStatsRef(myPet).set(seed, function () {
        myPetStatsAll[myPet] = seed;
        myPetStats = petCurrentStats(seed);
        renderPetScreen();
      });
      return;
    }
    myPetStats = petCurrentStats(stored);
    renderPetScreen();
  });
}
function watchMyXp() {
  var u = auth.currentUser;
  if (xpRef) { xpRef.off(); xpRef = null; }
  if (!u) { myXp = 0; return; }
  xpRef = db.ref("xp/" + u.uid);
  xpRef.on("value", function (snap) {
    var v = snap.val();
    myXp = (v && typeof v.xp === "number") ? v.xp : 0;
    var el = document.getElementById("pet-xp");
    if (el) { el.textContent = myXp; }
  });
}

/* ---------- auth + wiring ---------- */
document.getElementById("pet-feed-btn").onclick = function () { petApplyCare("feed", PET_FEED_COST); };
document.getElementById("pet-play-btn").onclick = function () { petApplyCare("play", PET_PLAY_COST); };
document.getElementById("pet-signout").onclick = function () { auth.signOut(); };
document.getElementById("signin-btn").onclick = function () {
  var em = document.getElementById("signin-email").value.trim();
  var pw = document.getElementById("signin-pass").value;
  var msg = document.getElementById("auth-msg");
  msg.textContent = "";
  if (!em || !pw) { msg.textContent = "enter your email and password."; return; }
  auth.signInWithEmailAndPassword(em, pw).catch(function (err) {
    msg.textContent = "could not sign in: " + (err && err.message ? err.message : "check your email and password.");
  });
};
auth.onAuthStateChanged(function (user) {
  var authBox = document.getElementById("auth-box");
  var petBox = document.getElementById("pet-box");
  if (!user || user.isAnonymous) {
    authBox.className = "";
    petBox.className = "hidden";
    myPet = null; myXp = 0; myPetStats = null; myPetStatsAll = null;
    if (xpRef) { xpRef.off(); xpRef = null; }
    if (user && user.isAnonymous) {
      document.getElementById("auth-msg").textContent = "That is a guest sign-in. Sign in with your Readium account to test pets.";
    }
    return;
  }
  authBox.className = "hidden";
  petBox.className = "";
  document.getElementById("pet-user").textContent = user.email || "signed in";
  watchMyXp();
  db.ref("users/" + user.uid + "/pet").once("value", function (snap) {
    myPet = snap.val() || null;
    loadPet();
  });
});
</script>
</body>
</html>
