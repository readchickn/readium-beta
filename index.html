<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Readium Beta</title>
<style>
  body { font-family: Georgia, "Times New Roman", serif; background: #ffffff; color: #111111; max-width: 620px; margin: 0 auto; padding: 16px 12px; font-size: 17px; line-height: 1.45; }
  .wrap { max-width: 620px; margin: 0 auto; }
  h1 { font-size: 28px; text-align: center; margin: 0 0 8px 0; }
  h2 { font-size: 22px; margin: 20px 0 8px 0; }
  p { margin: 0 0 16px 0; }
  a { color: #111111; }
  .feature { border: 3px solid #111111; background: #ffffff; padding: 14px; margin: 14px 0; }
  .feature h2 { margin: 0 0 6px; font-size: 22px; }
  .feature p { margin: 6px 0 10px; }
  a.btn { display: block; box-sizing: border-box; font-size: 18px; padding: 10px 16px; background: #111111; color: #ffffff; text-decoration: none; text-align: center; border: 3px solid #111111; margin: 6px 0; }
  .note { font-size: 15px; color: #555555; }
  .center { text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Readium Beta</h1>
  <p>Try upcoming Readium features before they go live, and tell us what you think.</p>
  <div id="feature-list"></div>
  <p class="center"><a class="btn" href="feedback.html">leave feedback</a></p>
  <p class="note">You need a Readium account to test features. Anyone with the link can leave feedback — no account needed.</p>
  <p class="center note"><a href="https://readium.ink">back to Readium</a></p>
</div>
<script>
// To add a feature later, add one entry here (and the same entry in
// feedback.html so it shows up in the feedback form's dropdown).
var BETA_FEATURES = [
  { id: "pets", name: "Pets", desc: "Raise a pet: feed it, play with it, level it up.", page: "pet-test.html" }
];
(function () {
  var list = document.getElementById("feature-list");
  if (!BETA_FEATURES.length) {
    list.innerHTML = "<p>No features being tested right now — check back soon!</p>";
    return;
  }
  for (var i = 0; i < BETA_FEATURES.length; i++) {
    (function (f) {
      var d = document.createElement("div");
      d.className = "feature";
      var h = document.createElement("h2");
      h.textContent = f.name;
      d.appendChild(h);
      var p = document.createElement("p");
      p.textContent = f.desc;
      d.appendChild(p);
      var a = document.createElement("a");
      a.className = "btn";
      a.href = f.page;
      a.textContent = "try it";
      d.appendChild(a);
      list.appendChild(d);
    })(BETA_FEATURES[i]);
  }
})();
</script>
</body>
</html>
